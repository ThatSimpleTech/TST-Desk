# tst-cu-mcp configuration — entirely optional.
#
# No config file is needed: every field below is already its default. Copy this
# to ~/.tst-cu-mcp/config.yaml (or point TST_CU_MCP_CONFIG at it) only to change
# something. Applies identically on macOS and Windows.

actuation:
  # The master switch for the hands. false refuses every mouse and keyboard
  # action while leaving screenshots working, so the model can still see but not
  # touch. Checked before every action, on every platform. Must be a boolean:
  # quoted forms ("true"/"false") are read as their literal value, and anything
  # else refuses to start the server rather than guess at a safety setting.
  enabled: true

killswitch:
  # Path to the stop-file. While it exists, actuation is refused. Create it to
  # halt immediately, delete it to resume — no restart either way.
  #
  # Default: ~/.tst-cu-mcp/STOP
  # The TST_CU_MCP_STOP_FILE environment variable overrides the default; this
  # setting overrides both.
  #
  # stop_file: C:\Users\you\.tst-cu-mcp\STOP

overlay:
  # The real-display glow: while the model drives, the edges of every screen
  # glow rust (macOS only today). Purely a signal — the panels ignore mouse
  # events, and they hide themselves for the instant of each screenshot so
  # they can never appear in a captured frame. The glow follows the
  # kill-switch: engaged means dark.
  #
  # Default: true on macOS, no-op elsewhere. The TST_CU_MCP_OVERLAY
  # environment variable (1/0) overrides this setting — the tst-desk daemon
  # sets it from the user's "show indicators on the real display" preference.
  enabled: true

# How the agent drives apps. `background` uses the accessibility tree
# (list_apps / ui_snapshot / ui_action) and does not take the pointer.
# `full_control` is screenshot + click/type and may hide other apps.
mode: background

scoping:
  # Empty allowlist means every app except denied. A non-empty list is an
  # allowlist: anything not named is refused.
  allowed_apps: []
  # Requests to see or drive these apps are rejected. Substring against
  # display name or bundle id, same matching as list_apps.
  denied_apps: []
  # After a full-control task that hid other apps, restore them.
  unhide_on_finish: true
