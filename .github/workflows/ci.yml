name: CI

# Default CI is three ubuntu-latest jobs. The old 3 job × 3 OS matrix
# billed macOS at 10× and Windows at 2× on every PR and every main push,
# which exhausted the org's $20/month Actions budget (TD-4904). macOS and
# Windows still build on Package (workflow_dispatch or a tstdesk-v* tag).
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "shell/**"
      - "ui/**"
      - "mcp/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - "shell/**"
      - "ui/**"
      - "mcp/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python ──────────────────────────────────────────────────────────

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Typecheck (mypy)
        # Strict mypy on product code only — the same gate every lane runs
        # locally. Tests are behavioral (pytest); holding them to strict
        # typing drifted from what developers actually run (76 annotation
        # errors accumulated). See DECISIONS.md 2026-08-14.
        run: uv run mypy tstd

      - name: Test (pytest)
        run: uv run pytest -q --tb=short
        env:
          PYTHONUTF8: "1"

  # ── Rust ────────────────────────────────────────────────────────────

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shell

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup component add clippy

      # Tauri build scripts link glib/webkit on Linux — same system deps
      # as package.yml.
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('shell/Cargo.lock') }}

      # tauri-build validates bundle.externalBin (TD-4809) at compile time,
      # so the sidecar path must exist even for clippy/test. CI never
      # bundles; an empty sentinel satisfies the existence check. The real,
      # smoke-tested binary comes from core/scripts/build_sidecar.py in the
      # package workflow.
      - name: Sentinel for externalBin validation
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: *//p')
          mkdir -p binaries
          : > "binaries/tstd-${triple}"

      - name: Clippy
        run: cargo clippy -- -D warnings

  # ── TypeScript ──────────────────────────────────────────────────────

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      # The fixtures step shells out to the Python generator.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Generate protocol fixtures
        run: cd ../core && uv run python scripts/generate_protocol_fixtures.py

      - name: Test (vitest)
        run: npm run test

      - name: Build
        run: npm run build
