name: Release

# TD-1303: pushing a tstdesk-vX.Y.Z tag bundles every platform (via
# package.yml's reusable job), then publishes a GitHub release with the
# artifacts, their SHA-256 checksums, and a changelog generated from story
# commits. App tags are namespaced (TD-4812): the tst-cu-mcp package cuts its
# own plain v* tags, and v0.2.0 matched the old bare-v* trigger and fired a
# failed app-release run.
on:
  push:
    tags: ["tstdesk-v*"]

jobs:
  bundle:
    uses: ./.github/workflows/package.yml

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changelog.py walks full history on a first release

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Tag must match the component versions
        run: |
          tag="${GITHUB_REF_NAME#tstdesk-v}"
          for f in shell/tauri.conf.json ui/package.json; do
            v=$(grep -m1 '"version"' "$f" | sed 's/[^0-9.]//g')
            [ "$v" = "$tag" ] || { echo "tag $tag != $f version $v"; exit 1; }
          done
          for f in core/pyproject.toml shell/Cargo.toml; do
            v=$(grep -m1 '^version' "$f" | sed 's/[^0-9.]//g')
            [ "$v" = "$tag" ] || { echo "tag $tag != $f version $v"; exit 1; }
          done

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Artifacts land in dmg/ appimage/ deb/ msi/ subdirs. GitHub Releases
      # also rewrites spaces in asset names to dots (`TST Desk_…` →
      # `TST.Desk_…`); checksums must use the download names.
      - name: Flatten, rename, checksum
        run: |
          mkdir -p flat
          find dist -type f -print0 | while IFS= read -r -d '' f; do
            base=$(basename "$f")
            cp "$f" "flat/${base// /.}"
          done
          (cd flat && sha256sum * > SHA256SUMS.txt)

      - name: Changelog
        working-directory: core
        run: uv run python scripts/changelog.py > ../CHANGELOG_RELEASE.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" flat/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "TST Desk $GITHUB_REF_NAME" --notes-file CHANGELOG_RELEASE.md
          else
            gh release create "$GITHUB_REF_NAME" --title "TST Desk $GITHUB_REF_NAME" --notes-file CHANGELOG_RELEASE.md flat/*
          fi
