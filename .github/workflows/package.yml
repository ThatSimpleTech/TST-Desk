name: Package

# TD-1302: per-platform bundles. Not on push to main — two macOS legs
# (arm64 + intel) bill at 10× and one green five-leg run is ~200
# Linux-equivalent minutes. Rapid main merges with cancel-in-progress:
# false queued overlapping matrices and exhausted the $20/month budget
# (TD-4904). Build on demand, or when release.yml calls this from a
# tstdesk-v* tag.
on:
  workflow_dispatch:
    inputs:
      platform:
        # TD-5300: one leg is enough to check a one-platform fix, and the
        # full matrix is about 200 Linux-equivalent minutes.
        description: "One platform to build, or all"
        type: choice
        default: all
        options: [all, macos-arm64, macos-x86_64, linux-x86_64, linux-aarch64, windows-x86_64]
  workflow_call: # TD-1303 release.yml reuses this matrix (always all of it)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # NOT cancel-in-progress: a bundle takes ~30-40 minutes, so on an active
  # main every push killed the run before it produced an artifact -- 28
  # cancelled runs and no successful one, which is why TD-1302 never ticked
  # (TD-1302).  Queue them instead; the concurrency group still keeps one
  # bundle per ref at a time.
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          WANT: ${{ inputs.platform || 'all' }}
        run: |
          # runner label drives both the Tauri target and the PyInstaller
          # sidecar triple; artifact names follow tauri's bundle layout.
          # macos-15-intel: x86_64-apple-darwin (macos-13 retired Dec 2025);
          # ubuntu-22.04-arm: aarch64-unknown-linux-gnu (TD-4902); both Linux
          # legs build on 22.04 for its glibc 2.35 floor (HOST2-01).
          all='[
            {"os":"macos-latest","platform":"macos-arm64"},
            {"os":"macos-15-intel","platform":"macos-x86_64"},
            {"os":"ubuntu-22.04","platform":"linux-x86_64"},
            {"os":"ubuntu-22.04-arm","platform":"linux-aarch64"},
            {"os":"windows-latest","platform":"windows-x86_64"}
          ]'
          picked=$(echo "$all" | jq -c --arg want "$WANT" 'map(select($want == "all" or .platform == $want))')
          echo "include=$picked" >> "$GITHUB_OUTPUT"

  bundle:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    # A macos leg once ran 24h before the platform stopped it, on a private
    # repo where macOS minutes bill at 10x.  No workflow here had any timeout
    # (TD-1302).  A bundle that has not finished in an hour is stuck, not slow.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils xvfb xauth

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust toolchain
        run: rustup component add clippy

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      # beforeBuildCommand builds the sidecar (core/scripts/build_sidecar.py,
      # which also smoke-launches it) and the UI; bundle.externalBin in
      # shell/tauri.conf.json ships the sidecar inside the bundle (TD-4809:
      # declared once there, so npm and CI cannot drift apart).
      # TAURI_BUNDLER_DMG_IGNORE_CI=false: tauri skips .dmg packaging on CI
      # by default (Finder AppleScript styling is flaky headless); runners
      # handle it — the dev host noted in the backlog entry could not.
      - name: Build the app bundle
        run: npm run tauri:build
        working-directory: ui
        env:
          TAURI_APP_PATH: ../shell
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"

      # TD-5163: the shipped sidecar (modules inflated) and UI must carry no
      # maintainer-private names or hosts. The list is a repository secret,
      # never in the tree; a fork without it skips, this repo fails without it.
      - name: Scan the build for private strings
        shell: bash
        working-directory: core
        env:
          TST_RELEASE_DENYLIST_TEXT: ${{ secrets.RELEASE_DENYLIST }}
          REQUIRE: ${{ github.repository == 'ThatSimpleTech/TST-Desk' && '--require' || '' }}
        run: uv run python scripts/release_scan.py $REQUIRE ../shell/binaries ../ui/build

      # The smoke test treats the runner as the clean machine: install the
      # produced bundle, find the bundled tstd sidecar inside it, and prove
      # it serves a port file with no system Python involved.
      - name: Smoke the bundled sidecar (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          APP=$(ls -d shell/target/release/bundle/macos/*.app | head -1)
          SIDECAR="$APP/Contents/MacOS/tstd"
          test -x "$SIDECAR"
          DATA=$(mktemp -d)
          "$SIDECAR" --data-dir "$DATA" --log-level INFO & PID=$!
          for i in $(seq 1 100); do [ -f "$DATA/port.json" ] && break; sleep 0.1; done
          kill $PID || true
          test -f "$DATA/port.json"
          ls shell/target/release/bundle/dmg/*.dmg
          # TD-1301 AC: launches with no Python installed. Scrub PATH to an
          # empty dir for the sidecar process only — a PyInstaller binary
          # must serve with zero interpreters reachable.
          NOPATH=$(mktemp -d)
          DATA2=$(mktemp -d)
          env -i PATH="$NOPATH" "$SIDECAR" --data-dir "$DATA2" --log-level INFO & PID2=$!
          for i in $(seq 1 100); do [ -f "$DATA2/port.json" ] && break; sleep 0.1; done
          kill $PID2 || true
          test -f "$DATA2/port.json"
          # TD-5228: the pinned agent-desktop CLI and its helper sit beside
          # tstd, signed along with the app (ad-hoc here, run-tauri.mjs), and
          # the CLI runs from there. Signing changes the bytes, so the release
          # digest is not checked here; the daemon trusts the packaged copy
          # (TD-5222).
          AD="$APP/Contents/MacOS/agent-desktop"
          test -x "$APP/Contents/MacOS/agent-desktop-macos-helper"
          codesign -v "$AD"
          codesign -v "$APP/Contents/MacOS/agent-desktop-macos-helper"
          "$AD" version | grep -q '"version":"1.0.2"'
          ls "$APP/Contents/Resources/licenses/LICENSE" "$APP/Contents/Resources/licenses/NOTICE"

      - name: Smoke the bundled sidecar (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          SIDECAR=shell/target/release/bundle/appimage/*.AppImage
          ls $SIDECAR
          # AppImage bundles mount the whole app; the deb tree shows the
          # sidecar at its installed exe-sibling path instead.
          cd shell/target/release/bundle/deb
          dpkg-deb -x *.deb extracted
          BIN=$(ls extracted/usr/bin/tstd)
          DATA=$(mktemp -d)
          "$PWD/$BIN" --data-dir "$DATA" --log-level INFO & PID=$!
          for i in $(seq 1 100); do [ -f "$DATA/port.json" ] && break; sleep 0.1; done
          kill $PID || true
          test -f "$DATA/port.json"
          # TD-5221: the pinned agent-desktop CLI and its helper sit beside
          # tstd, the CLI's digest is the daemon's pin, and it runs from there.
          test -x extracted/usr/bin/agent-desktop-linux-clipboard-owner
          (cd ../../../../../core && uv run python - "$OLDPWD/extracted/usr/bin/agent-desktop") <<'PY'
          import hashlib, sys
          from tstd.desktop.ax_cli import PINNED_SHA256
          digest = hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest()
          assert digest in PINNED_SHA256.values(), digest
          PY
          extracted/usr/bin/agent-desktop version | grep -q '"version":"1.0.2"'
          ls extracted/usr/lib/*/licenses/LICENSE extracted/usr/lib/*/licenses/NOTICE
          # TD-5222: the AppImage tool rewrites the binaries it packs, so its
          # copy differs from the release digest. It must still be there and
          # run; the daemon trusts the packaged copy rather than the digest.
          AI=$(ls "$OLDPWD"/shell/target/release/bundle/appimage/*.AppImage)
          (mkdir -p ai && cd ai && "$AI" --appimage-extract 'usr/bin/*' > /dev/null)
          test -x ai/squashfs-root/usr/bin/agent-desktop-linux-clipboard-owner
          ai/squashfs-root/usr/bin/agent-desktop version | grep -q '"version":"1.0.2"'
          # TD-1301 AC: the bare ubuntu image ships no Python at all — the
          # strictest no-Python machine available in CI.
          docker run --rm -v "$PWD/extracted:/app:ro" ubuntu:22.04 sh -c '
            DATA=$(mktemp -d)
            /app/usr/bin/tstd --data-dir "$DATA" --log-level INFO & PID=$!
            for i in $(seq 1 100); do [ -f "$DATA/port.json" ] && break; sleep 0.1; done
            kill $PID || true
            test -f "$DATA/port.json"
          '

      # HOST2-01: the 0.5.0 x86_64 AppImage needed glibc 2.43 (Ubuntu 26.04)
      # because it was built on ubuntu-latest. The Linux legs build on
      # ubuntu-22.04 now; this fails the build if anything shipped needs a
      # newer C library than that image's 2.35.
      - name: Check the Linux bundles' glibc floor
        if: runner.os == 'Linux'
        run: |
          set -e
          FLOOR=2.35
          cd shell/target/release/bundle
          AI=$(ls appimage/*.AppImage)
          rm -rf floor && mkdir floor && (cd floor && "$OLDPWD/$AI" --appimage-extract > /dev/null)
          mkdir -p floor/deb && dpkg-deb -x deb/*.deb floor/deb
          worst=$(find floor -type f -print0 | while IFS= read -r -d '' f; do
              if head -c4 "$f" 2>/dev/null | grep -q 'ELF'; then
                objdump -T "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//'
              fi
            done | sort -V | tail -1)
          echo "highest glibc symbol version needed: $worst (floor $FLOOR)"
          [ "$(printf '%s\n%s\n' "$worst" "$FLOOR" | sort -V | tail -1)" = "$FLOOR" ] || {
            echo "::error::a shipped binary needs glibc $worst, newer than $FLOOR"; exit 1; }

      # WEBKIT-03: launch the packaged app itself, not the dev server. With
      # TST_DESK_SMOKE_REPORT set the host opens a per-session window the way
      # the rail's menu does, asks every window whether the app shell
      # rendered, writes the answers and quits (shell/src/smoke.rs). The
      # session window was a 404 in every 0.5.0 build (WEBKIT-01).
      - name: Smoke the packaged Linux app's windows
        if: runner.os == 'Linux'
        run: |
          set -e
          AI=$(ls "$PWD"/shell/target/release/bundle/appimage/*.AppImage)
          REPORT="$RUNNER_TEMP/smoke.json"
          export HOME="$RUNNER_TEMP/smoke-home" && mkdir -p "$HOME"
          APPIMAGE_EXTRACT_AND_RUN=1 TST_DESK_SMOKE_REPORT="$REPORT" \
            xvfb-run -a timeout 120 "$AI" || true
          test -s "$REPORT" || { echo "::error::the packaged app wrote no smoke report"; exit 1; }
          cat "$REPORT"
          python3 - "$REPORT" <<'PY'
          import json, sys
          from urllib.parse import parse_qs, urlsplit
          report = json.load(open(sys.argv[1]))
          assert "error" not in report, report
          windows = report["windows"]
          for label in ("main", "session-smoke"):
              assert windows[label]["ok"], (label, windows[label])
          url = urlsplit(windows["session-smoke"]["url"])
          assert url.path == "/", url
          assert parse_qs(url.query) == {"bind_session": ["smoke"]}, url
          print("both windows rendered the app shell")
          PY

      # The 0.5.4 start-up failure: a long-used install (183 chats) never
      # connected, because every chat was revived before the daemon wrote
      # port.json and the host gave up after 30 s. Gate every release on a
      # data folder like that one: 300 chats, long event logs, a project
      # tree each. The packaged app must connect within 10 s of launch.
      - name: Gate a long-used install's start (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          AI=$(ls "$PWD"/shell/target/release/bundle/appimage/*.AppImage)
          export HOME="$RUNNER_TEMP/gate-home" && mkdir -p "$HOME"
          DATA="$HOME/.local/share/tst-desk"
          (cd core && uv run python scripts/make_startup_fixture.py "$DATA" --sessions 300 --turns 60 --files 200)
          LOG="$DATA/logs/host.log"
          OUT="$RUNNER_TEMP/gate-app.log"
          START=$(date +%s.%N)
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 90 "$AI" >"$OUT" 2>&1 &
          APP=$!
          # Watch for up to 60 s so a miss reports how long it really took.
          ELAPSED=""
          for i in $(seq 1 600); do
            if grep -q "connected to tstd" "$LOG" 2>/dev/null; then
              ELAPSED=$(python3 -c "import sys,time; print(round(time.time() - float(sys.argv[1]), 2))" "$START")
              break
            fi
            sleep 0.1
          done
          kill "$APP" 2>/dev/null || true
          pkill -f "appimage_extracted|\.mount_|/tstd" 2>/dev/null || true
          echo "connected after: ${ELAPSED:-never (60 s)}"
          ls -la "$DATA" "$DATA/logs" 2>/dev/null || true
          tail -20 "$LOG" 2>/dev/null || true
          tail -20 "$DATA/logs/tstd.stderr.log" 2>/dev/null || true
          tail -20 "$OUT" || true
          [ -n "$ELAPSED" ] || { echo "::error::the packaged app never connected to tstd on a 300-chat data folder"; exit 1; }
          python3 -c "import sys; sys.exit(0 if float(sys.argv[1]) <= 10 else 1)" "$ELAPSED" || { echo "::error::the packaged app took ${ELAPSED} s to connect to tstd on a 300-chat data folder (limit 10 s)"; exit 1; }

      - name: Smoke the bundled sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # TD-5300: test what ships. The MSI is extracted with an
          # administrative install (msiexec /a), which writes its files and
          # registers nothing, and the tstd.exe inside it is the one run. The
          # NSIS setup is installed silently into a temp folder to show it
          # carries the sidecar too. The staged copy beside tst-desk.exe in
          # target/release is not what users get, and on some runs it is not
          # there at all (0.5.0).
          $msi = Get-ChildItem shell/target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw "no MSI was built" }
          $msiOut = Join-Path $env:RUNNER_TEMP "msi-extract"
          $run = Start-Process msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$msiOut`"" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "msiexec /a exited $($run.ExitCode)" }
          $sidecar = Get-ChildItem $msiOut -Recurse -Filter tstd.exe | Select-Object -First 1
          if (-not $sidecar) { throw "the MSI carries no tstd.exe" }
          $app = Get-ChildItem $sidecar.DirectoryName -Filter tst-desk.exe
          if (-not $app) { throw "tstd.exe is not beside tst-desk.exe in the MSI" }
          "MSI sidecar: $($sidecar.FullName) ($($sidecar.Length) bytes)"
          $setup = Get-ChildItem shell/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS setup was built" }
          $nsisOut = Join-Path $env:RUNNER_TEMP "nsis-install"
          # /D must come last and unquoted.
          $run = Start-Process $setup.FullName -ArgumentList "/S /D=$nsisOut" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "the NSIS setup exited $($run.ExitCode)" }
          if (-not (Test-Path (Join-Path $nsisOut "tstd.exe"))) { throw "the NSIS install has no tstd.exe" }
          "NSIS sidecar: $(Join-Path $nsisOut 'tstd.exe')"
          $data = New-Item -ItemType Directory -Path (Join-Path $env:TEMP ([guid]::NewGuid()))
          $proc = Start-Process $sidecar.FullName -ArgumentList "--data-dir `"$data`" --log-level INFO" -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-Path (Join-Path $data "port.json")) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 100 }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $data "port.json"))) { throw "bundled sidecar did not serve" }
          # TD-1301 AC: relaunch with PATH reduced to System32 so no Python
          # install is reachable; the bundled runtime must serve anyway.
          $data2 = New-Item -ItemType Directory -Path (Join-Path $env:TEMP ([guid]::NewGuid()))
          $savedPath = $env:PATH
          $env:PATH = "C:\Windows\System32"
          $proc2 = Start-Process $sidecar.FullName -ArgumentList "--data-dir `"$data2`" --log-level INFO" -PassThru
          $env:PATH = $savedPath
          $deadline2 = (Get-Date).AddSeconds(30)
          while (-not (Test-Path (Join-Path $data2 "port.json")) -and (Get-Date) -lt $deadline2) { Start-Sleep -Milliseconds 100 }
          Stop-Process -Id $proc2.Id -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $data2 "port.json"))) { throw "sidecar did not serve with no Python on PATH" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tst-desk-${{ matrix.platform }}
          path: |
            shell/target/release/bundle/dmg/*.dmg
            shell/target/release/bundle/appimage/*.AppImage
            shell/target/release/bundle/deb/*.deb
            shell/target/release/bundle/msi/*.msi
            shell/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
