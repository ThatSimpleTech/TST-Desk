name: Package

# TD-1302: per-platform bundles.  Runs on main (keeps artifacts fresh) and
# on demand.  TD-1303 builds the tagged-release publishing on top of this.
on:
  push:
    branches: [main]
    # TD-4904: doc-only merges must not enqueue another 30–40 minute matrix
    # behind an already-blocked Actions queue. Release tags and manual runs
    # still bundle via workflow_call / workflow_dispatch.
    paths:
      - "shell/**"
      - "ui/**"
      - "core/**"
      - ".github/workflows/package.yml"
  workflow_dispatch:
  workflow_call: # TD-1303 release.yml reuses this matrix

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # NOT cancel-in-progress: a bundle takes ~30-40 minutes, so on an active
  # main every push killed the run before it produced an artifact -- 28
  # cancelled runs and no successful one, which is why TD-1302 never ticked
  # (TD-1302).  Queue them instead; the concurrency group still keeps one
  # bundle per ref at a time.
  cancel-in-progress: false

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # runner label drives both the Tauri target and the PyInstaller
          # sidecar triple; artifact names follow tauri's bundle layout.
          - os: macos-latest # aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-13 # x86_64-apple-darwin (Intel runner)
            platform: macos-x86_64
          - os: ubuntu-latest # x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-24.04-arm # aarch64-unknown-linux-gnu (TD-4902)
            platform: linux-aarch64
          - os: windows-latest # x86_64-pc-windows-msvc
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    # A macos leg once ran 24h before the platform stopped it, on a private
    # repo where macOS minutes bill at 10x.  No workflow here had any timeout
    # (TD-1302).  A bundle that has not finished in an hour is stuck, not slow.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust toolchain
        run: rustup component add clippy

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      # beforeBuildCommand builds the sidecar (core/scripts/build_sidecar.py,
      # which also smoke-launches it) and the UI; bundle.externalBin in
      # shell/tauri.conf.json ships the sidecar inside the bundle (TD-4809:
      # declared once there, so npm and CI cannot drift apart).
      # TAURI_BUNDLER_DMG_IGNORE_CI=false: tauri skips .dmg packaging on CI
      # by default (Finder AppleScript styling is flaky headless); runners
      # handle it — the dev host noted in the backlog entry could not.
      - name: Build the app bundle
        run: npm run tauri:build
        working-directory: ui
        env:
          TAURI_APP_PATH: ../shell
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"

      # The smoke test treats the runner as the clean machine: install the
      # produced bundle, find the bundled tstd sidecar inside it, and prove
      # it serves a port file with no system Python involved.
      - name: Smoke the bundled sidecar (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          APP=$(ls -d shell/target/release/bundle/macos/*.app | head -1)
          SIDECAR="$APP/Contents/MacOS/tstd"
          test -x "$SIDECAR"
          DATA=$(mktemp -d)
          "$SIDECAR" --data-dir "$DATA" --log-level INFO & PID=$!
          for i in $(seq 1 100); do [ -f "$DATA/port.json" ] && break; sleep 0.1; done
          kill $PID || true
          test -f "$DATA/port.json"
          ls shell/target/release/bundle/dmg/*.dmg
          # TD-1301 AC: launches with no Python installed. Scrub PATH to an
          # empty dir for the sidecar process only — a PyInstaller binary
          # must serve with zero interpreters reachable.
          NOPATH=$(mktemp -d)
          DATA2=$(mktemp -d)
          env -i PATH="$NOPATH" "$SIDECAR" --data-dir "$DATA2" --log-level INFO & PID2=$!
          for i in $(seq 1 100); do [ -f "$DATA2/port.json" ] && break; sleep 0.1; done
          kill $PID2 || true
          test -f "$DATA2/port.json"

      - name: Smoke the bundled sidecar (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          SIDECAR=shell/target/release/bundle/appimage/*.AppImage
          ls $SIDECAR
          # AppImage bundles mount the whole app; the deb tree shows the
          # sidecar at its installed exe-sibling path instead.
          cd shell/target/release/bundle/deb
          dpkg-deb -x *.deb extracted
          BIN=$(ls extracted/usr/bin/tstd)
          DATA=$(mktemp -d)
          "$PWD/$BIN" --data-dir "$DATA" --log-level INFO & PID=$!
          for i in $(seq 1 100); do [ -f "$DATA/port.json" ] && break; sleep 0.1; done
          kill $PID || true
          test -f "$DATA/port.json"
          # TD-1301 AC: the bare ubuntu image ships no Python at all — the
          # strictest no-Python machine available in CI.
          docker run --rm -v "$PWD/extracted:/app:ro" ubuntu:22.04 sh -c '
            DATA=$(mktemp -d)
            /app/usr/bin/tstd --data-dir "$DATA" --log-level INFO & PID=$!
            for i in $(seq 1 100); do [ -f "$DATA/port.json" ] && break; sleep 0.1; done
            kill $PID || true
            test -f "$DATA/port.json"
          '

      - name: Smoke the bundled sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sidecar = Get-ChildItem shell/target/release/bundle/msi -Recurse -Filter tstd.exe -ErrorAction SilentlyContinue
          if (-not $sidecar) {
            # MSI is an installer database; check the raw exe-sibling layout
            # tauri stages next to the release binary instead.
            $sidecar = Get-Item shell/target/release/tstd.exe
          }
          $data = New-Item -ItemType Directory -Path (Join-Path $env:TEMP ([guid]::NewGuid()))
          $proc = Start-Process $sidecar.FullName -ArgumentList "--data-dir `"$data`" --log-level INFO" -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-Path (Join-Path $data "port.json")) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 100 }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $data "port.json"))) { throw "bundled sidecar did not serve" }
          Get-ChildItem shell/target/release/bundle/msi/*.msi
          # TD-1301 AC: relaunch with PATH reduced to System32 so no Python
          # install is reachable; the bundled runtime must serve anyway.
          $data2 = New-Item -ItemType Directory -Path (Join-Path $env:TEMP ([guid]::NewGuid()))
          $savedPath = $env:PATH
          $env:PATH = "C:\Windows\System32"
          $proc2 = Start-Process $sidecar.FullName -ArgumentList "--data-dir `"$data2`" --log-level INFO" -PassThru
          $env:PATH = $savedPath
          $deadline2 = (Get-Date).AddSeconds(30)
          while (-not (Test-Path (Join-Path $data2 "port.json")) -and (Get-Date) -lt $deadline2) { Start-Sleep -Milliseconds 100 }
          Stop-Process -Id $proc2.Id -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $data2 "port.json"))) { throw "sidecar did not serve with no Python on PATH" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tst-desk-${{ matrix.platform }}
          path: |
            shell/target/release/bundle/dmg/*.dmg
            shell/target/release/bundle/appimage/*.AppImage
            shell/target/release/bundle/deb/*.deb
            shell/target/release/bundle/msi/*.msi
          if-no-files-found: error
