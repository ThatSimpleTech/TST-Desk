[package]
name = "tst-desk"
version = "0.1.0"
description = "TST Desk — open-source BYO-model desktop agent workspace"
authors = ["That Simple Tech"]
license = "Apache-2.0"
repository = "https://github.com/ThatSimpleTech/tst-desk"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tst_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yml = "0.0.13"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["process", "net", "time", "rt", "sync", "macros"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
which = "7"
dirs = "6"
