[package]
name = "tst-desk"
version = "0.4.5"
description = "TST Desk — open-source BYO-model desktop agent workspace"
authors = ["That Simple Tech"]
license = "Apache-2.0"
repository = "https://github.com/ThatSimpleTech/tst-desk"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tst_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yml = "0.0.13"
log = "0.4"
base64 = "0.22"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["process", "net", "time", "rt", "sync", "macros", "io-util", "fs"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
which = "7"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
hex = "0.4.3"

# TD-5144: free space before a received download (statfs/statvfs,
# GetDiskFreeSpaceExW). Both were already in Cargo.lock.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"
