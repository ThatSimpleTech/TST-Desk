# TST Desk — Model configuration
# ===============================
#
# The model landscape moves weekly. Update these values without a release.
# Slugs, prices, and URLs live here, never in Python source code.
#
# Four presets are shipped. Customize any tier within a preset, or add
# your own presets below.
#
# A tier has:
#   slug             — OpenRouter slug or any model identifier. Optional for
#                      a loopback base_url, where leaving it out resolves the
#                      model from the endpoint's /v1/models on first use.
#                      Required for any off-box endpoint.
#   base_url         — OpenAI-compatible API endpoint
#   input_price      — $ per million input tokens (prompt)
#   output_price     — $ per million output tokens (completion)
#   cache_read_price — $ per million input tokens read from cache
#   context_window   — max context tokens the model supports
#   max_output_tokens — max tokens the model may generate; sent as
#                        max_tokens on every turn (TD-5008)
#   credential        — named API key from the credentials catalog
#                        below. Omit on a loopback tier for no key
#                        (TD-1801). An off-box tier with no credential
#                        uses `openrouter` so existing keychains keep
#                        working.
#   extra_body        — optional map added to every request body for
#                        the tier, e.g. chat_template_kwargs for a
#                        llama.cpp server. It fills in only fields the
#                        request did not set. It cannot set model,
#                        messages, tools, tool_choice, stream,
#                        stream_options, max_tokens or
#                        max_completion_tokens. Plain JSON values only
#                        (quote dates). Never put a key here.
#   verdict_extra_body — merged over extra_body on 8-token verdict calls only

# Named API keys (TD-1717). Names live here; secrets live in the OS
# keychain under tst-<id>. Settings shows the name, never the secret.
# base_url is the host this key talks to (TD-1718). Selecting the key
# uses that host even when the active preset is local. Omit it on a
# keyed local server so the tier URL stays in charge.
credentials:
  openrouter:
    name: OpenRouter
    base_url: https://openrouter.ai/api/v1

presets:
  # ── tst-default ──────────────────────────────────────────────────
  # Documented swaps (uncomment to use, or copy into another preset):
  #   brain — z-ai/glm-5.2 (cheaper brain)
  #   validator — z-ai/glm-5.2 (stronger validator)
  #   worker — deepseek/deepseek-v4-pro (heavier worker)
  tst-default:
    brain:
      slug: moonshotai/kimi-k3
      base_url: https://openrouter.ai/api/v1
      credential: openrouter
      input_price: 2.80
      output_price: 14.00
      cache_read_price: 0.30
      context_window: 1000000
      max_output_tokens: 8192
    worker:
      slug: deepseek/deepseek-v4-flash
      base_url: https://openrouter.ai/api/v1
      credential: openrouter
      input_price: 0.07
      output_price: 0.17
      cache_read_price: 0.07
      context_window: 128000
      max_output_tokens: 16384
    validator:
      slug: deepseek/deepseek-v4-pro
      base_url: https://openrouter.ai/api/v1
      credential: openrouter
      input_price: 0.44
      output_price: 0.87
      cache_read_price: 0.44
      context_window: 128000
      max_output_tokens: 8192

  # ── budget ───────────────────────────────────────────────────────
  # Cheaper brain (GLM-5.2), same worker and validator.
  budget:
    brain:
      # GLM-5.2 — cheaper brain, also works as a stronger validator
      slug: z-ai/glm-5.2
      base_url: https://openrouter.ai/api/v1
      credential: openrouter
      input_price: 0.15
      output_price: 0.60
      cache_read_price: 0.015
      context_window: 128000
      max_output_tokens: 8192
    worker:
      slug: deepseek/deepseek-v4-flash
      base_url: https://openrouter.ai/api/v1
      credential: openrouter
      input_price: 0.07
      output_price: 0.17
      cache_read_price: 0.07
      context_window: 128000
      max_output_tokens: 16384
    validator:
      # DeepSeek V4 Pro — stronger validator, also works as a heavier worker
      slug: deepseek/deepseek-v4-pro
      base_url: https://openrouter.ai/api/v1
      credential: openrouter
      input_price: 0.44
      output_price: 0.87
      cache_read_price: 0.44
      context_window: 128000
      max_output_tokens: 8192

  # ── local ────────────────────────────────────────────────────────
  # Zero-cost local models on this machine. Targets Ollama's
  # OpenAI-compatible endpoint (the default port); any OpenAI-compatible
  # server on loopback works — point base_url at it.
  # A loopback base_url needs no API key at all (TD-1801).
  #
  # No slug is named on purpose: the endpoint is a convention, the model
  # tag is your machine. With slug left out, the model is read from the
  # endpoint's /v1/models the first time a turn needs it. That requires
  # the server to be serving exactly one model — pick one explicitly by
  # uncommenting slug below, which always wins over discovery.
  #
  # One model serves all three tiers: a single local server usually has
  # room for one loaded model, and swapping per tier would pay an unload
  # and reload on every routing hop.
  #
  # context_window is a compaction budget, not a request parameter. It
  # must be no larger than what the *server* actually serves: Ollama caps
  # context at num_ctx (OLLAMA_CONTEXT_LENGTH or the Modelfile),
  # independent of a model's much larger architectural ceiling. Shipping
  # the ceiling would keep compaction from ever firing and let the server
  # silently truncate the oldest messages — the steering block goes
  # first. 32768 is a conservative floor that local hardware can hold.
  # Raise it here once you have raised num_ctx to match.
  local:
    brain:
      # slug: your-model-tag   # omitted → resolved from /v1/models
      base_url: http://127.0.0.1:11434/v1
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096
    worker:
      # slug: your-model-tag   # omitted → resolved from /v1/models
      base_url: http://127.0.0.1:11434/v1
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096
    validator:
      # slug: your-model-tag   # omitted → resolved from /v1/models
      base_url: http://127.0.0.1:11434/v1
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096

  # ── vllm ─────────────────────────────────────────────────────────────
  # Zero-cost local models on this machine. Targets vLLM's OpenAI-
  # compatible server (the default port). EZER serves the same /v1
  # shape — attach it with this preset. If the process listens on
  # another port, edit base_url here; never in Python.
  # A loopback base_url needs no API key at all (TD-1801).
  #
  # No slug is named on purpose: the endpoint is a convention, the model
  # tag is your machine. With slug left out, the model is read from the
  # endpoint's /v1/models the first time a turn needs it. That requires
  # the server to be serving exactly one model — pick one explicitly by
  # uncommenting slug below, which always wins over discovery.
  #
  # One model serves all three tiers: a single local server usually has
  # room for one loaded model, and swapping per tier would pay an unload
  # and reload on every routing hop.
  #
  # context_window is a compaction budget, not a request parameter. It
  # must be no larger than what the *server* actually serves. Shipping
  # a model's architectural ceiling would keep compaction from ever
  # firing and let the server silently truncate the oldest messages —
  # the steering block goes first. 32768 is a conservative floor that
  # local hardware can hold. Raise it here once the server's context
  # matches.
  vllm:
    brain:
      # slug: your-model-tag   # omitted → resolved from /v1/models
      base_url: http://127.0.0.1:8000/v1
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096
    worker:
      # slug: your-model-tag   # omitted → resolved from /v1/models
      base_url: http://127.0.0.1:8000/v1
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096
    validator:
      # slug: your-model-tag   # omitted → resolved from /v1/models
      base_url: http://127.0.0.1:8000/v1
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096

# Web search. The agent's web_search tool sends the query to base_url as
# ?q=... — never a host written into Python. Empty base_url disables the
# primary only. Each fallback is tried in order when the URLs before it
# fail or return nothing parseable; all empty disables search.
search:
  base_url: https://html.duckduckgo.com/html/
  fallback_base_urls:
    - https://www.bing.com/search
  timeout_seconds: 15
  max_results: 8
  fetch_max_bytes: 200000
  # web_fetch reads a long page in windows of this many characters, and
  # keeps fetched pages in memory (never on disk) this many seconds.
  fetch_page_chars: 30000
  fetch_cache_seconds: 900

# Local embeddings sidecar. OpenAI POST /v1/embeddings only — never Ollama
# /api/embed (that evicts a resident chat model). Empty base_url disables.
# A down sidecar falls back to heading-match memory loading (TD-2201).
# command (string or argv list) is host-only (TD-2204). Empty / omitted is
# attach-only — a filled base_url never causes the host to spawn.
embeddings:
  base_url: http://127.0.0.1:8080/v1
  model: nomic-embed-text
  timeout_seconds: 2
  top_k: 4
  token_budget: 2000

# Pinned project context on the brain prompt (TD-2805). Over cap, last
# pin in is first dropped.
project_context:
  token_budget: 2000

# User-global steering (TD-4845). ~/.tstdesk/AGENTS.md is always the
# global file. ~/.claude/CLAUDE.md is Claude Code's file and is not
# read — nor anything it imports — unless this is true. Workspace and
# nested CLAUDE.md are project files and are not gated here. When this
# is false and that Claude file exists with no ~/.tstdesk/AGENTS.md,
# Doctor's steering row says it was not loaded.
steering:
  claude_global_fallback: false

# On-disk session event log (TD-2901). Attach replays this file. The cap
# is an event count so from_seq stays honest; 0 is invalid, not unbounded.
session:
  log_max_events: 10000
  # send_file (TD-5143): the largest file the agent may send (512 MiB; at most
  # 2 GiB), and the most this session may hold in sent files (4 GiB).
  send_file_max_bytes: 536870912
  send_file_session_max_bytes: 4294967296

# Clear stale tool results (TD-5115). Once the prompt passes the compaction
# budget, tool results from earlier turns, oldest first, become a one-line
# placeholder (tool, target, size) before whole turns are compacted. The
# newest keep_recent_tool_results stay, and so does every result of a tool
# named in exclude_tools and every ask_user answer (the person's own words).
# A clear that cannot free clear_at_least_tokens, or cannot bring the prompt
# down to 70% of the budget while compaction has an older turn to fold, is
# skipped. enabled: false goes back to compaction alone.
clear_tool_results:
  enabled: true
  keep_recent_tool_results: 3
  clear_at_least_tokens: 2000
  exclude_tools: []

# How compaction writes its summary (TD-5128). summary: model asks the worker
# tier for a structured summary (goal, decisions, files touched, open items);
# summary_prompt replaces the built-in prompt when set. A worker that fails,
# takes longer than summary_timeout_seconds or answers without the built-in
# prompt's four headings leaves the short extractive summary instead, and
# summary: extractive never calls a model. From background_percent of the
# compaction budget the summary is written in the background, so the turn
# that reaches the budget does not wait (0 turns that off). Afterwards the
# files read or changed in the folded turns are read again, newest first,
# within reinject_files files and reinject_tokens tokens.
compaction:
  summary: model
  summary_prompt: ""
  summary_max_tokens: 1200
  summary_timeout_seconds: 120
  background_percent: 75
  reinject_files: 5
  reinject_tokens: 6000

# The consult tool (TD-5119): the tier doing the work asks the brain (or
# the validator) one short question with the context it picks, and gets the
# answer back as the tool result. A tier not listed in tiers is off. The
# worker is listed, so worker turns and delegate children (which run on the
# worker tier) have it; the brain and the validator do not. max_per_turn
# caps the consults of one turn. Each one is a call on the tier it asks and
# shows on the meter there.
consult:
  tiers: [worker]
  max_per_turn: 2

# Shell commands that run without asking (TD-5103). Only these built-in
# read-only entries can be listed: delete lines to shrink the list, or set
# enabled: false to have every shell command ask. A command qualifies only
# when every part of it is on the list, with no redirect, no write, exec
# or symlink-following flag, and no path outside the workspace.
shell:
  read_only:
    enabled: true
    commands:
      - ls
      - pwd
      - cat
      - head
      - tail
      - wc
      - file
      - stat
      - git status
      - git log
      - git diff
      - git show
      - git branch
      - rg
      - grep
      - find

# How stubbornly to retry a retryable provider failure (429, 5xx, transport).
# The defaults spend 4 attempts in roughly 8 seconds — fine for a blip, and
# too short for a gateway that answers "temporarily rate-limited upstream,
# retry shortly" with no Retry-After. Free and preview models served from a
# shared pool do exactly that, and the turn dies waiting 8 seconds for
# capacity that was a minute away. Delays back off exponentially from
# initial_delay and are capped at max_delay, so max_retries: 8 is about
# three minutes of patience. Raise it if your model is popular and free;
# leave it if you would rather fail fast and resend by hand.
provider_retry:
  max_retries: 3
  initial_delay: 1.0
  max_delay: 60.0

# How long one scheduled turn may run (TD-3819), and the base wait for
# `tst run`. A research job makes many tool calls and needs minutes;
# 120 seconds recorded that as a timeout and then retried it. 900 is
# 15 minutes. A job can set its own limit from 1 to 60 minutes.
# `tst run --timeout` replaces this base for one command. The provider
# retry allowance is still added on top.
scheduler:
  max_run_seconds: 900

# A git worktree per session (TD-5126). A session or scheduled job in a git
# repository works in its own worktree, on a new branch tst/wt/<id> from the
# main checkout's HEAD. folder: where worktrees go; empty is worktrees/ in
# this data dir. A workspace turns it off with `worktree: {enabled: false}`
# in its .tst/config.yaml. setup_timeout_s bounds that file's worktree.setup.
worktree:
  enabled: true
  folder: ""
  setup_timeout_s: 600

# Desktop computer-use (TD-3301). Empty command is mock-only — no sidecar,
# no pointer motion. A non-empty command is argv for mcp/tst-cu-mcp over
# stdio (no socket). The daemon owns the child.
# browser: mock (default, CI) or playwright (TD-1710). Missing Playwright
# always falls back to the in-process mock.
# grounding (TD-3902): local UI-TARS (or compatible) click targeting.
# Empty base_url is off — clicks use the intended (x, y). A filled URL
# must be loopback (the vllm preset's :8000/v1, or a dedicated sidecar).
# Optional slug is discovered from /v1/models when omitted.
# local_worker_preset (TD-3903): after this session has used a desktop_
# or browser_ tool, the worker *client* uses that named preset's worker
# tier (loopback URL + optional slug). Brain is unchanged. Empty = never
# remap. The name is a preset key, not a model slug.
# max_prompt_images (TD-1730): how many image_url parts a completion may
# keep. 1 matches ezer-forge / many local VLMs. 0 strips all images.
computer_use:
  command: ""
  browser: mock
  grounding:
    base_url: ""
    timeout_seconds: 8
  local_worker_preset: vllm
  max_prompt_images: 1

# Opt-in Tailscale bind (TD-3601). Empty is off: 127.0.0.1 only.
# Settings → Allow remote attach (TD-3603) turns this on. The documented
# default target is tailscale0 (or a CGNAT / ULA address 3601 already
# accepts). Never 0.0.0.0 / ::. A non-Tailscale LAN address is refused.
remote:
  bind: ""

# Rootless container for autonomous runs only (TD-4301). Interactive
# sessions ignore runtime and image. runtime is argv0 (PATH or an absolute
# path). image is the tag the argv execs — never a Python literal.
# A missing or rootful runtime refuses start with install copy.
# check_every: validator drift check every N autonomy turns (TD-4201).
# verify: interactive post-write review (TD-4204): off | after_write | ask.
# verify_max_prompt_tokens: cap on that review's estimated prompt; null is
# 60% of the validator tier's context_window (TD-5153).
autonomy:
  runtime: podman
  image: docker.io/library/alpine:3.21
  check_every: 5
  verify: after_write
  verify_max_prompt_tokens: null

# User-listed MCP servers (TD-4401). Empty is none — no doctor rows,
# no dynamic discovery. HTTP urls must be loopback. A server's env:
# (stdio) or headers: (http) holds literals that are not secrets, or
# "keychain:<entry>" — tokens stay in the keychain (TD-5110); Settings →
# MCP servers stores one without showing it. Once the MCP tool schemas
# would take over 10% of a tier's context_window, they stay out of the
# request and the agent loads the ones it needs with tool_search
# (TD-5127); tool_search: {mode: auto|always|off, threshold_percent: 10}.
mcp:
  servers: {}

# Slack incoming webhook (TD-3801), ntfy (TD-3802), Discord and Telegram
# (TD-4707). Off by default. Slack is the default channel. Destination
# URLs are keychain secrets (tst-slack-webhook, tst-ntfy-topic,
# tst-discord-webhook, tst-telegram-bot), never this file. SMTP
# (TD-3820) is notify.email; its password is tst-smtp-password in the
# keychain, never a yaml key. host is the only destination send() may
# reach — set it to the URL's hostname, or the SMTP hostname, when
# you enable a channel. There is no 20-platform gateway.
notify:
  slack:
    enabled: false
    host: ""
    timeout_seconds: 5
  ntfy:
    enabled: false
    host: ""
    timeout_seconds: 5
  discord:
    enabled: false
    host: ""
    timeout_seconds: 5
  telegram:
    enabled: false
    host: ""
    timeout_seconds: 5
  email:
    enabled: false
    # smtp (TD-3820) or microsoft (TD-4853, Graph sendMail after sign-in).
    method: smtp
    host: ""
    port: 587
    security: starttls
    username: ""
    from_address: ""
    timeout_seconds: 30

# Agent engine. native is the TST 3-tier OpenAI-compatible loop.
# grok spawns the installed Grok Build CLI over ACP — the CLI remains
# the engine, this window is a viewer. Empty binary means PATH, then
# ~/.grok/bin/grok. Grok credentials stay in ~/.grok/auth.json.
engine:
  kind: native
  binary: ""

# Hold-to-talk dictation (TD-4701). Off in Settings until you turn it on.
# Empty base_url uses OS dictation in the composer (no network from tstd).
# A filled URL is an OpenAI-compatible /v1 root; tstd POSTs
# /audio/transcriptions. The host lives here, never in Python.
# credential names a key from the catalog above; required when base_url
# is off-box, omitted on loopback.
voice:
  base_url: ""
  credential: ""
  timeout_seconds: 30

# Hold-to-talk (TD-4701). Off by default. There is no cloud speech URL.
# Set base_url to an OpenAI-compatible transcriptions root (include /v1),
# typically a loopback whisper server. Optional credential is a named
# keychain id; the secret is never this file.
speech:
  enabled: false
  base_url: ""
  model: ""
  timeout_seconds: 30
  credential: ""

# Judgment-seam features (TD-708/709/710/711, dev). All off by default.
# The default backend is the worker tier you already run. `typesafe` is an
# opt-in hosted connector: its key lives in the OS keychain under the
# `typesafe` credential (Settings → API keys), never in this file.
judgments:
  verification: false
  semantic_breaker: false
  candidate_selection: false
  confidence_threshold: 0.6
  max_state_chars: 2000
  backend: worker
  typesafe_base_url: "https://api.typesafe.ai"
  typesafe_model: "jev-latest"
  typesafe_credential: "typesafe"

# GitHub App device flow (TD-4852). Off until client_id is set. There is
# no client secret and no callback URL. Tokens live in the OS keychain
# under tst-github-oauth, never in this file. Hosts are public and live
# here so the daemon does not hard-code them.
connectors:
  github:
    client_id: ""
    api_host: api.github.com
    web_host: github.com
    timeout_seconds: 20
  # Microsoft sign-in for scheduled-job email (TD-4853). Off until
  # client_id is set. Public client: no secret. Redirect is an ephemeral
  # 127.0.0.1 port. Tokens live in the OS keychain under
  # tst-microsoft-oauth, never in this file. Hosts are public and live
  # here so the daemon does not hard-code them.
  microsoft:
    client_id: ""
    tenant: common
    login_host: login.microsoftonline.com
    graph_host: graph.microsoft.com
    timeout_seconds: 20
    sign_in_timeout_seconds: 300
  # Google sign-in for scheduled-job email (TD-4854). Off until client_id
  # is set. The desktop client secret is not confidential, and it still
  # lives in the OS keychain under tst-google-client-secret, never in
  # this file. Tokens live under tst-google-oauth. Redirect is an
  # ephemeral 127.0.0.1 port. Hosts are public and live here so the
  # daemon does not hard-code them.
  google:
    client_id: ""
    auth_host: accounts.google.com
    token_host: oauth2.googleapis.com
    userinfo_host: openidconnect.googleapis.com
    gmail_host: gmail.googleapis.com
    timeout_seconds: 20
    sign_in_timeout_seconds: 300
