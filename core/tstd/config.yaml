# TST Desk — Model configuration
# ===============================
#
# The model landscape moves weekly. Update these values without a release.
# Slugs, prices, and URLs live here, never in Python source code.
#
# Three presets are shipped. Customize any tier within a preset, or add
# your own presets below.
#
# A tier has:
#   slug             — OpenRouter slug or any model identifier. Optional for
#                      a loopback base_url, where leaving it out resolves the
#                      model from the endpoint's /v1/models on first use.
#                      Required for any off-box endpoint.
#   base_url         — OpenAI-compatible API endpoint
#   input_price      — $ per million input tokens (prompt)
#   output_price     — $ per million output tokens (completion)
#   cache_read_price — $ per million input tokens read from cache
#   context_window   — max context tokens the model supports
#   max_output_tokens — max tokens the model may generate

presets:
  # ── tst-default ──────────────────────────────────────────────────
  # Documented swaps (uncomment to use, or copy into another preset):
  #   brain — z-ai/glm-5.2 (cheaper brain)
  #   validator — z-ai/glm-5.2 (stronger validator)
  #   worker — deepseek/deepseek-v4-pro (heavier worker)
  tst-default:
    brain:
      slug: moonshotai/kimi-k3
      base_url: https://openrouter.ai/api/v1
      input_price: 2.80
      output_price: 14.00
      cache_read_price: 0.30
      context_window: 1000000
      max_output_tokens: 8192
    worker:
      slug: deepseek/deepseek-v4-flash
      base_url: https://openrouter.ai/api/v1
      input_price: 0.07
      output_price: 0.17
      cache_read_price: 0.07
      context_window: 128000
      max_output_tokens: 16384
    validator:
      slug: deepseek/deepseek-v4-pro
      base_url: https://openrouter.ai/api/v1
      input_price: 0.44
      output_price: 0.87
      cache_read_price: 0.44
      context_window: 128000
      max_output_tokens: 8192

  # ── budget ───────────────────────────────────────────────────────
  # Cheaper brain (GLM-5.2), same worker and validator.
  budget:
    brain:
      # GLM-5.2 — cheaper brain, also works as a stronger validator
      slug: z-ai/glm-5.2
      base_url: https://openrouter.ai/api/v1
      input_price: 0.15
      output_price: 0.60
      cache_read_price: 0.015
      context_window: 128000
      max_output_tokens: 8192
    worker:
      slug: deepseek/deepseek-v4-flash
      base_url: https://openrouter.ai/api/v1
      input_price: 0.07
      output_price: 0.17
      cache_read_price: 0.07
      context_window: 128000
      max_output_tokens: 16384
    validator:
      # DeepSeek V4 Pro — stronger validator, also works as a heavier worker
      slug: deepseek/deepseek-v4-pro
      base_url: https://openrouter.ai/api/v1
      input_price: 0.44
      output_price: 0.87
      cache_read_price: 0.44
      context_window: 128000
      max_output_tokens: 8192

  # ── local ────────────────────────────────────────────────────────
  # Zero-cost local models on this machine. Targets Ollama's
  # OpenAI-compatible endpoint (the default port); any OpenAI-compatible
  # server on loopback works — point base_url at it.
  # A loopback base_url needs no API key at all (TD-1801).
  #
  # No slug is named on purpose: the endpoint is a convention, the model
  # tag is your machine. With slug left out, the model is read from the
  # endpoint's /v1/models the first time a turn needs it. That requires
  # the server to be serving exactly one model — pick one explicitly by
  # uncommenting slug below, which always wins over discovery.
  #
  # One model serves all three tiers: a single local server usually has
  # room for one loaded model, and swapping per tier would pay an unload
  # and reload on every routing hop.
  #
  # context_window is a compaction budget, not a request parameter. It
  # must be no larger than what the *server* actually serves: Ollama caps
  # context at num_ctx (OLLAMA_CONTEXT_LENGTH or the Modelfile),
  # independent of a model's much larger architectural ceiling. Shipping
  # the ceiling would keep compaction from ever firing and let the server
  # silently truncate the oldest messages — the steering block goes
  # first. 32768 is a conservative floor that local hardware can hold.
  # Raise it here once you have raised num_ctx to match.
  local:
    brain:
      # slug: your-model-tag   # omitted → resolved from /v1/models
      base_url: http://127.0.0.1:11434/v1
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096
    worker:
      # slug: your-model-tag   # omitted → resolved from /v1/models
      base_url: http://127.0.0.1:11434/v1
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096
    validator:
      # slug: your-model-tag   # omitted → resolved from /v1/models
      base_url: http://127.0.0.1:11434/v1
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096

# Web search. The agent's web_search tool sends the query to this URL as
# ?q=... — never a host written into Python. Empty base_url disables it.
search:
  base_url: https://html.duckduckgo.com/html/
  timeout_seconds: 15
  max_results: 8
  fetch_max_bytes: 200000

# Local embeddings sidecar. OpenAI POST /v1/embeddings only — never Ollama
# /api/embed (that evicts a resident chat model). Empty base_url disables.
# A down sidecar falls back to heading-match memory loading (TD-2201).
embeddings:
  base_url: http://127.0.0.1:8080/v1
  model: nomic-embed-text
  timeout_seconds: 2
  top_k: 4
  token_budget: 2000

# Pinned project context on the brain prompt (TD-2805). Over cap, last
# pin in is first dropped.
project_context:
  token_budget: 2000