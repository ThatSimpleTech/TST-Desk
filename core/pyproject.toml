[project]
name = "tstd"
version = "0.1.0"
description = "TST Desk core daemon"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "jsonschema>=4.26.0",
    "pydantic>=2",
    "pyyaml>=6.0",
    "websockets>=17.0.1",
]

[project.scripts]
tstd = "tstd.daemon:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=4.6.2",
    "pyinstaller>=6.22.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tstd"]
include = ["tstd/config.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
