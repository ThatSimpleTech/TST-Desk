[project]
name = "tstd"
version = "0.4.4"
description = "TST Desk core daemon"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "jsonschema>=4.26.0",
    "pydantic>=2",
    # PDF text for attachments (TD-5131), and for fs_read (TD-5130). Apache-2.0
    # / BSD-3 bindings over PDFium (BSD-3); wheels carry the library for every
    # platform we build. Imported on the first PDF, not at start; no network.
    "pypdfium2>=5.14",
    "pyyaml>=6.0",
    # fs_grep matching with a time limit, outside the GIL (TD-5102): the
    # stdlib re can backtrack for hours on one line while holding the GIL.
    "regex>=2024.11.6",
    # Pure-Python QR for the phone pairing code (TD-5014). No hidden import:
    # it is imported at module level, so PyInstaller's analysis sees it.
    "segno>=1.6",
    # zoneinfo has no tz database on Windows; job time zones need one (TD-3808).
    "tzdata>=2024.1; sys_platform == 'win32'",
    "websockets>=17.0.1",
]

[project.scripts]
tstd = "tstd.daemon:main"
tst = "tstd.cli:main"

# In-process tool plugins (TD-4601). tstd ships none; third-party packages
# expose register(registry, dispatcher) under this group. License is fail-closed.
[project.entry-points."tstd.tools"]

[dependency-groups]
dev = [
    # Reference MCP SDK servers for the protocol tests (TD-5136); the same
    # pin as the sidecar group, so the lock carries one version.
    "mcp==2.0.0",
    "mypy>=1.11",
    "pre-commit>=4.6.2",
    "pyinstaller>=6.22.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0",
    "types-pyyaml>=6.0.12.20260724",
    "types-regex>=2024.11.6",
]
# Frozen into the tstd sidecar so ``tstd --cu-mcp`` works without a checkout.
# The pyobjc frameworks are macOS-only and match tst_cu_mcp's pins: the CU
# backend imports them function-locally, so PyInstaller must be told to
# collect them (TD-4834 — a frozen build without them has no eyes or hands).
sidecar = [
    "mcp==2.0.0",
    "pillow==12.3.0",
    "pyobjc-framework-applicationservices==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-quartz==12.2.2; sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tstd"]
include = ["tstd/config.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"

# ``tst-cu-mcp`` is a sibling checkout put on ``sys.path`` at run time
# (``cu_host._prepare_cu_imports``); it is not a dependency of this package.
[[tool.mypy.overrides]]
module = ["tst_cu_mcp", "tst_cu_mcp.*"]
ignore_missing_imports = true

# PDFium bindings (TD-5130, TD-5131) ship no type information.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Live tests need a model server on this machine, which CI does not have
# and a developer may not have running.  Deselected by default so the
# ordinary suite stays offline; opt in with `uv run pytest -m live`.
addopts = ["-m", "not live"]
markers = [
    "live: needs a reachable local OpenAI-compatible model endpoint",
    "shipped_config: new user configs copy the real shipped file (empty catalog), not the test catalog",
]
# Leaked sockets and exceptions raised from ``__del__`` fail the run.
# TD-4835 showed the suite can stay clean under these. TD-4846 makes
# that the default so a later change cannot drop the gate by forgetting
# the command-line flags.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
